# Mạch T3 — cm_dgppo_scalar (ACI vô hướng cũ, dòng ablation) trên LidarSpread, N=3, σ_train = "vừa" (tạm thời, chờ T2 chốt lưới σ).
method: cm_dgppo_scalar
env: LidarSpread          # LidarSpread | LidarLine
N: 3
n_obs: 3
seed: 0

noise:
  sigma_w: 0.005          # nhiễu động học, cộng vào vị trí mỗi bước (car_radius = 0.05)
  sigma_v: 0.01           # nhiễu cảm biến: tự định vị + vị trí tương đối LiDAR
  shift: 0.0

train:
  steps: 200000           # mặc định DGPPO; smoke test: --steps 20 --debug
  n_env_train: 128
  n_env_test: 32
  batch_size: 16384
  eval_interval: 50
  save_interval: 50
logging:

# Bản docs/scripts.tex: δ_{t+1} = clip(δ_t + η(e_t − α), 0, δ_max), e_t = tỉ lệ cửa sổ có vi phạm thật.
cm:
  cm_alpha: 0.05
  cm_eta: 0.001           # đơn vị khoảng cách mỗi update
  cm_delta_max: 0.05      # = 1 bán kính agent
  cm_per_agent: false     # (d)
  cm_window_steps: 0      # (e) 0 = theo episode; >0 = cửa sổ T_w bước
logging:
  backend: wandb          # wandb | none
