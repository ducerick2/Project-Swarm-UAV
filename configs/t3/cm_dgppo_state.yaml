# Mạch T3 — cm_dgppo_state trên LidarSpread, N=3, σ_train = "vừa" (tạm thời, chờ T2 chốt lưới σ).
method: cm_dgppo_state
env: LidarSpread          # LidarSpread | LidarLine
N: 3
n_obs: 3
seed: 0

noise:
  sigma_w: 0.005          # nhiễu động học, cộng vào vị trí mỗi bước (car_radius = 0.05)
  sigma_v: 0.01           # nhiễu cảm biến: tự định vị + vị trí tương đối LiDAR
  shift: 0.0

train:
  steps: 200000           # mặc định DGPPO; smoke test: --steps 20 --debug
  n_env_train: 128
  n_env_test: 32
  batch_size: 16384
  eval_interval: 50
  save_interval: 50

# Biên conformal (methods/cm_dgppo/algo.py). alpha là TỔNG, chia đều cho các luồng ACI.
cm:
  cm_alpha: 0.05
  cm_gamma: 0.01          # bước ACI
  cm_level: step          # step | episode
  sigma_base: 0.05        # sigma_m(o) = sigma_base + sigma_kappa * dt * tốc_độ_tiếp_cận
  sigma_kappa: 5.0
  q_max_h: 5.0            # chặn |q^h| (đơn vị chuẩn hóa)
  q_max_cbf: 0.1          # chặn |q^cbf| (đơn vị Vh); vào điều kiện CBF dưới dạng q/dt
logging:
  backend: wandb          # wandb | none
