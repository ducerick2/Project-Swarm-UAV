# Mạch T3 — fixed_margin (baseline biên cố định δ*) trên LidarSpread, N=3, σ_train = "vừa" (tạm thời, chờ T2 chốt lưới σ).
method: fixed_margin
tag: d0.02              # đổi theo δ khi quét: --set tag=d0.01 cm.cm_fixed_delta=0.01
env: LidarSpread          # LidarSpread | LidarLine
N: 3
n_obs: 3
seed: 0

noise:
  sigma_w: 0.005          # nhiễu động học, cộng vào vị trí mỗi bước (car_radius = 0.05)
  sigma_v: 0.01           # nhiễu cảm biến: tự định vị + vị trí tương đối LiDAR
  shift: 0.0

train:
  steps: 200000           # mặc định DGPPO; smoke test: --steps 20 --debug
  n_env_train: 128
  n_env_test: 32
  batch_size: 16384
  eval_interval: 50
  save_interval: 50
logging:

# h~ = h(o~) + δ, δ cố định (đơn vị khoảng cách; car_radius = 0.05).
# Quét: δ ∈ {0.005, 0.01, 0.02, 0.03, 0.05} x 3 seed, eval tại σ_train với --eval-seed 20000,
# rồi scripts/select_delta_star.py chọn δ*.
cm:
  cm_fixed_delta: 0.02
logging:
  backend: wandb          # wandb | none
